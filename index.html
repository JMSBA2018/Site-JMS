<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        JMS Ar Condicionado e Refrigeração | Camaçari e Região
    </title>


    <style>

        :root {
            --primary: #0066c8;
            --primary-dark: #003d73;
            --accent: #25d366;
            --dark: #071b2d;
            --text: #1a1a1a;
            --light: #f5f8fb;
        }


        * {
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            margin: 0;
            padding: 0;

            color: var(--text);
            background: var(--light);

            line-height: 1.6;
        }


        .container {
            max-width: 1100px;

            margin: 0 auto;

            padding: 0 20px;
        }



        /* ==================================================
           PRIMEIRA TELA / HERO
        ================================================== */

        header {

            background:

                radial-gradient(
                    circle at 80% 15%,
                    rgba(0, 102, 200, 0.22),
                    transparent 35%
                ),

                linear-gradient(
                    145deg,
                    #071b2d 0%,
                    #0b2c47 60%,
                    #071b2d 100%
                );

            color: white;

            text-align: center;

            padding: 45px 0 55px;
        }


        .hero-logo {

            display: block;

            width: 290px;
            max-width: 78%;

            height: auto;

            margin: 0 auto 7px;
        }


        .hero-desde {

            display: block;

            font-size: 0.78rem;

            font-weight: bold;

            letter-spacing: 4px;

            color: #d5dce4;

            margin-bottom: 32px;
        }


        header h1 {

            max-width: 820px;

            margin: 0 auto 18px;

            font-size: 2.7rem;

            line-height: 1.12;

            font-weight: 800;

            color: white;
        }


        /* Título inteiro na mesma cor */

        header h1 span {
            color: inherit;
        }


        .hero-descricao {

            max-width: 720px;

            margin: 0 auto 28px;

            font-size: 1.22rem;

            line-height: 1.5;

            color: #eef4f8;
        }


        .hero-servicos {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 10px;

            margin: 0 auto 28px;
        }


        .hero-servico {

            border: 1px solid rgba(255,255,255,0.25);

            background: rgba(255,255,255,0.06);

            padding: 8px 15px;

            border-radius: 30px;

            font-size: 0.92rem;

            font-weight: bold;
        }


        .btn-whatsapp {

            display: inline-block;

            background-color: var(--accent);

            color: white;

            padding: 15px 30px;

            text-decoration: none;

            font-weight: bold;

            font-size: 1.08rem;

            border-radius: 50px;

            box-shadow:
                0 5px 14px rgba(0,0,0,0.25);

            transition: 0.3s;
        }


        .btn-whatsapp:hover {

            transform: scale(1.03);

            background-color: #1eb954;
        }


        .hero-regiao {

            margin: 22px auto 0;

            font-size: 0.98rem;

            color: #dce5ec;
        }



        /* ==================================================
           SEÇÕES GERAIS
        ================================================== */

        section {
            padding: 60px 0;
        }


        .bg-white {
            background: white;
        }


        h2 {

            text-align: center;

            color: var(--primary);

            margin-bottom: 40px;

            font-size: 1.8rem;
        }



        /* ==================================================
           QUEM SOMOS
        ================================================== */

        .sobre-jms {

            background: #ffffff;

            padding: 65px 0 55px;
        }


        .sobre-jms-grid {

            display: grid;

            grid-template-columns:
                1.05fr 0.95fr;

            gap: 50px;

            align-items: center;
        }


        .sobre-jms-label {

            display: inline-block;

            color: var(--primary);

            font-weight: bold;

            font-size: 0.86rem;

            letter-spacing: 1px;

            margin-bottom: 9px;
        }


        .sobre-jms-texto h2 {

            text-align: left;

            color: var(--dark);

            font-size: 2.2rem;

            line-height: 1.15;

            margin: 0 0 22px;
        }
