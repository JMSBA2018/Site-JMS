<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS Ar Condicionado e Refrigeração | Camaçari e Região</title>

    <style>
        :root {
            --primary: #0066c8;
            --primary-dark: #003d73;
            --accent: #25d366;
            --dark: #071b2d;
            --text: #1a1a1a;
            --light: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text);
            background: var(--light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        /* ==================================================
           HERO / PRIMEIRA TELA (AJUSTADO E PROPORCIONAL)
        ================================================== */
        header {
            background:
                radial-gradient(circle at 80% 15%, rgba(0, 102, 200, 0.25), transparent 40%),
                linear-gradient(135deg, #051322 0%, #071b2d 50%, #0b2c47 100%);
            color: white;
            text-align: center;
            padding: 55px 0 65px;
        }

        .hero-logo {
            width: 240px;
            max-width: 75%;
            height: auto;
            display: block;
            margin: 0 auto 8px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        .hero-marca {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 0 auto 4px;
        }

        .hero-desde {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: #93c5fd;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            line-height: 1.3;
            max-width: 850px;
            margin: 0 auto 18px;
            font-weight: 700;
        }

        .hero-servicos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 0 auto 24px;
        }

        .hero-servico {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            padding: 7px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        /* Botão do WhatsApp redimensionado para ficar elegante */
        .btn-whatsapp {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.98rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            transition: all 0.3s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background-color: #1eb954;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* ==================================================
           SEÇÕES GERAIS (Espaçamento otimizado para evitar cortes e vazios)
        ================================================== */
        section {
            padding: 40px 0;
        }

        .bg-white {
            background: white;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* ==================================================
           QUEM SOMOS
        ================================================== */
        .sobre-jms {
            background: #ffffff;
            padding: 40px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .sobre-jms-grid {
            max-width: 950px;
            margin: 0 auto;
            text-align: center;
        }

        .sobre-jms-label {
            display: inline-block;
            background: #e7f1ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .sobre-jms-texto p {
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.7;
            color: #334155;
        }

        /* ==================================================
           PORTFÓLIO / GALERIA DE SERVIÇOS (3 COLUNAS)
        ================================================== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .gallery-item {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .gallery-grid img {
            width: 100%;
            height: 145px; /* Ajustado para eliminar o corte vertical e encaixar na tela */
            object-fit: cover;
            display: block;
        }

        .gallery-caption {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .gallery-caption h3 {
            margin: 0 0 8px;
            color: var(--dark);
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.35;
        }

        .gallery-caption p {
            margin: 0;
            font-size: 0.92rem;
            color: #64748b;
            line-height: 1.45;
        }

        /* ==================================================
           CALCULADORA DE BTUS
        ================================================== */
        .calculadora-wrapper {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            padding: 50px 40px;
            border-radius: 16px;
            margin-top: 50px;
            border: 1px solid #e2e8f0;
        }

        .calculadora-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            max-width: 560px;
            margin: 0 auto;
        }

        /* ==================================================
           ÁREA DE ATENDIMENTO & FOOTER
        ================================================== */
        .atendimento-box {
            background: white;
            border-radius: 16px;
            padding: 50px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .atendimento-box p {
            font-size: 1.15rem;
            color: #334155;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        footer {
            background-color: var(--dark);
            color: #94a3b8;
            text-align: center;
            padding: 30px 0;
            font-size: 0.92rem;
        }

        /* ==================================================
           BOTÃO FLUTUANTE WHATSAPP
        ================================================== */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: var(--accent);
            color: white;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            text-align: center;
            font-size: 32px;
            line-height: 64px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
            z-index: 1000;
            text-decoration: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        .whatsapp-float.oculto {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* ==================================================
           RESPONSIVIDADE (TABLET E CELULAR)
        ================================================== */
        @media (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            header {
                padding: 45px 0 40px;
            }

            header h1 {
                font-size: 1.35rem;
                padding: 0 10px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            section {
                padding: 40px 0;
            }

            h2 {
                font-size: 1.6rem;
                margin-bottom: 20px;
            }

            .btn-whatsapp {
                width: 100%;
                max-width: 400px;
                padding: 15px 20px;
                font-size: 1rem;
            }

            .calculadora-wrapper {
                padding: 25px 15px;
            }

            .calculadora-card {
                padding: 20px 15px;
            }
            
            .whatsapp-float {
                width: 54px;
                height: 54px;
                right: 18px;
                bottom: 18px;
                font-size: 26px;
                line-height: 54px;
            }
        }
    </style>
</head>
