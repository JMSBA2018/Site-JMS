<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JMS Ar Condicionado e Refrigeração | Camaçari e Região</title>

    <style>
        :root {
            --primary: #0066c8;
            --primary-dark: #003d73;
            --accent: #25d366;
            --dark: #071b2d;
            --text: #1a1a1a;
            --light: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--text);
            background: var(--light);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        /* ==================================================
           HERO / TOPO INSTITUCIONAL
        ================================================== */
        header {
            background:
                radial-gradient(circle at 50% 20%, rgba(0, 102, 200, 0.28), transparent 50%),
                linear-gradient(135deg, #051322 0%, #071b2d 50%, #0b2c47 100%);
            color: white;
            text-align: center;
            padding: 60px 0 70px;
        }

        /* Logo com presença visual e destaque total */
        .hero-logo {
            width: 280px;
            max-width: 85%;
            height: auto;
            display: block;
            margin: 0 auto 12px;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.4));
        }

        .hero-marca {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 0 auto 4px;
        }

        .hero-desde {
            display: block;
            font-size: 0.78rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: #93c5fd;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.1rem;
            line-height: 1.35;
            max-width: 880px;
            margin: 0 auto 20px;
            font-weight: 700;
        }

        .hero-servicos {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0 auto 28px;
        }

        .hero-servico {
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            backdrop-filter: blur(4px);
        }

        /* Botão WhatsApp proporcional */
        .btn-whatsapp {
            display: inline-block;
            background-color: var(--accent);
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 50px;
            box-shadow: 0 5px 18px rgba(37, 211, 102, 0.35);
            transition: all 0.3s ease;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            background-color: #1eb954;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.45);
        }

        /* ==================================================
           SEÇÕES GERAIS
        ================================================== */
        section {
            padding: 80px 0;
        }

        .bg-white {
            background: white;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 40px;
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* ==================================================
           QUEM SOMOS
        ================================================== */
        .sobre-jms {
            background: #ffffff;
            padding: 70px 0;
            border-bottom: 1px solid #edf2f7;
        }

        .sobre-jms-grid {
            max-width: 950px;
            margin: 0 auto;
            text-align: center;
        }

        .sobre-jms-label {
            display: inline-block;
            background: #e7f1ff;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .sobre-jms-texto p {
            margin: 0;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #334155;
        }
